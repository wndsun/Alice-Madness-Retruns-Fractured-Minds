; AliceFracturedMinds settings (a fork of Alice Co-op by Docwitson).
; Location: <game>\Binaries\Win32\AliceCoop\AliceCoop.ini
; Role, server address and port can also be changed in-game: press M.

[Network]
; 1 = co-op starts with the game (normal Steam / EA App launch).
EnableWithoutLauncher = 1
; host or client. AliceCoop-Host.bat / AliceCoop-Client.bat override this.
Role = host
; IP address of the PC running AliceCoopServer.exe. 127.0.0.1 = this PC.
; For two PCs use a LAN or trusted VPN address (for example Radmin VPN).
ServerAddress = 127.0.0.1
; UDP port - the same for both players and the server.
Port = 27018
SendRateHz = 30
PeerTimeoutMs = 3000

[VisualProxy]
; The other player's Alice as seen in your game.
Enabled = 1
; One-process diagnostic only. Keep 0.
LocalMirror = 0
MirrorDistance = 160
DisableCollision = 1
InterpolationSpeed = 8
; Remote hair calibration. Change only if the hair looks wrong.
HairRotationX = 180
HairRotationY = 265
HairRotationZ = 0
HairRotationTarget = 3
HairOffsetX = 0.3
HairOffsetY = 0.0
HairOffsetZ = -2.2
HairHeadCollisionRadius = 15.0
HairTuningEnabled = 0
; Cosmetic double-jump/glide particle history on the remote Alice.
PreserveMovementTrails = 0
ProxyClothPhysics = 1
ProxyClothSim = 0
ProxyClothSimApply = 1
ProxyClothLegRadius = 11
ProxyClothLegCollision = 1
ProxyOwnHairTemplate = 1
ProxyClothSimWriteSite = 0
ProxyClothAnchorMode = 2
ProxyHysteriaDress = 1
ProxyHysteriaHair = 1
ProxyPepperMuzzle = 1
ProxyParticleNotifyEcho = 1
ProxyKnifeTrailNotify = 1
ProxyPepperProjectiles = 1
ProxyRealPepperBullets = 1
ProxyTeapotProjectiles = 1
ProxyExactJumpFloatVfx = 1
ProxyTeapotFlightTemplate = 1
ProxyTeapotShellExtras = 1
ProxyHairMatchLocal = 1
ProxyWeaponMeshSwap = 1

[SharedWorld]
; The host is authoritative for ordinary enemies: health, death and position.
EnemyHealth = 1
EnemyTransforms = 1
EnemyPositionRadius = 12000
EnemyCorrectionSpeed = 22
EnemySnapDistance = 1200
; Local two-window testing only. Keep 0.
BackgroundWindowDamageGuard = 0

[Enemies]
HostRunsAll = 0

[Window]
ForceWindowed = 0
ManageGeometry = 0
X = 0
Y = 0
Width = 960
Height = 540

[Performance]
; Two 32-bit game processes need memory headroom - keep these defaults.
LowMemoryMode = 1
MaxFPS = 60
MaxPoolThreads = 4

[Trace]
; Developer diagnostics. Keep every trace at 0 for normal play.
Enabled = 0
EventWindowMs = 2500
WorldEnabled = 0
WorldRadius = 10000
VfxLifecycleEnabled = 0
AnimationLifecycleEnabled = 0
AnimationComparisonEnabled = 0
ControlLifecycleEnabled = 0

[General]
; Game console (F2): 1 = on, 0 = off. Without this key the
; EnableConsole value from MadnessPatch.ini is used.
; GameConsole = 0

[Debug]
; Logs = 0 turns off every file the mod writes (logs, crash trail, records,
; dumps). Set Logs = 1 when you need to send logs with a bug report.
Logs = 0
; Short trail of the last actions, written with a crash report (needs Logs = 1).
DiagTrail = 1
; Large developer recordings. Keep 0.
HairRecord = 0
EnemyRecord = 0
; Research dumps (code, Flash movies, hair, Executioner AI). Keep 0.
Dumps = 0
SphinxDump = 0
; Stability guards. Keep these values.
HeapGuard = 1
PoolNativeStop = 1
PoolIntegrityGuard = 1
ProxyTeardownDetach = 0
DodgeProbe = 0
OnScreenStatus = 0
