name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the v prefix
        required: true
        default: 1.0.0

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "${{ inputs.version }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build release archive
        shell: pwsh
        run: .\tools\Build-Release.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AliceFracturedMinds-${{ steps.version.outputs.value }}
          if-no-files-found: error
          path: |
            artifacts/*.zip
            artifacts/*-SHA256SUMS.txt

      - name: Create draft GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath artifacts -File |
            Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*-SHA256SUMS.txt' } |
            ForEach-Object FullName
          gh release create "${{ github.ref_name }}" @assets `
            --title "AliceFracturedMinds ${{ steps.version.outputs.value }}" `
            --notes "See CHANGELOG.md" `
            --draft
